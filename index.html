<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ケアステーションほたる</title>
<style>
html,body{margin:0;min-height:100%;font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f5fcfc;color:#2d646a}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{font-size:1.1rem;line-height:1.8}
</style>
</head>
<body>
<div class="loading"><strong>ケアステーションほたる<br>読み込み中です…</strong></div>
<script>
(async()=>{
 try{
  const files=['pages.parts/p0.txt','pages.parts/p1.txt','pages.parts/p2.txt','pages.parts/p3.txt'];
  const parts=await Promise.all(files.map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw new Error(p);return (await r.text()).trim();}));
  const bin=atob(parts.join(''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div class="loading"><strong>ページを読み込めませんでした。<br>時間をおいて再読み込みしてください。</strong></div>';console.error(e);}
})();
</script>
</body>
</html>
